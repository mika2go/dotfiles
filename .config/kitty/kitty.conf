# Wallpaper-matched Kitty setup for Hyprland.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

disable_ligatures never
adjust_line_height  2
adjust_column_width 0

# Generated from the same dominant wallpaper colour as Quickshell.
include /home/mika/System/dotfiles/.config/kitty/wallpaper-theme.conf
auto_reload_config 0.2

background_opacity 0.84
background_blur    24
dynamic_background_opacity yes

window_padding_width 16
window_margin_width  0
draw_minimal_borders yes
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size yes
initial_window_width  980
initial_window_height 620

scrollback_lines 10000
wheel_scroll_multiplier 4.0
enable_audio_bell no
visual_bell_duration 0.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
shell_integration enabled
allow_remote_control yes

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_tab
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down
