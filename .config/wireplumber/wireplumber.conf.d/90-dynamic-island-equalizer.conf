# Six-band stereo equalizer for the Dynamic Island media controls.
# WirePlumber's smart-filter policy inserts it transparently before the
# current default sink, so applications do not need to target a virtual sink.

wireplumber.profiles = {
  main = {
    filter.sink.dynamic-island-equalizer = required
  }
}

wireplumber.components = [
  {
    name = libpipewire-module-filter-chain, type = pw-module
    arguments = {
      node.name        = "filter.sink.dynamic-island-equalizer"
      node.description = "Dynamic Island Equalizer"
      media.name       = "Dynamic Island Equalizer"

      filter.graph = {
        nodes = [
          {
            type = builtin
            name = band_60
            label = bq_lowshelf
            control = { "Freq" = 60.0, "Q" = 1.0, "Gain" = 0.0 }
          }
          {
            type = builtin
            name = band_150
            label = bq_peaking
            control = { "Freq" = 150.0, "Q" = 1.0, "Gain" = 0.0 }
          }
          {
            type = builtin
            name = band_400
            label = bq_peaking
            control = { "Freq" = 400.0, "Q" = 1.0, "Gain" = 0.0 }
          }
          {
            type = builtin
            name = band_1000
            label = bq_peaking
            control = { "Freq" = 1000.0, "Q" = 1.0, "Gain" = 0.0 }
          }
          {
            type = builtin
            name = band_3000
            label = bq_peaking
            control = { "Freq" = 3000.0, "Q" = 1.0, "Gain" = 0.0 }
          }
          {
            type = builtin
            name = band_10000
            label = bq_highshelf
            control = { "Freq" = 10000.0, "Q" = 1.0, "Gain" = 0.0 }
          }
        ]
        links = [
          { output = "band_60:Out", input = "band_150:In" }
          { output = "band_150:Out", input = "band_400:In" }
          { output = "band_400:Out", input = "band_1000:In" }
          { output = "band_1000:Out", input = "band_3000:In" }
          { output = "band_3000:Out", input = "band_10000:In" }
        ]
      }

      audio.channels = 2
      audio.position = [ FL, FR ]

      capture.props = {
        media.class = Audio/Sink
        filter.smart = true
        filter.smart.name = "filter.sink.dynamic-island-equalizer"
        filter.smart.disabled = false
      }

      playback.props = {
        node.passive = true
        media.role = "DSP"
      }
    }
    provides = filter.sink.dynamic-island-equalizer
  }
]
