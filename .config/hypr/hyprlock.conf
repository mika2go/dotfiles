$font = JetBrainsMono Nerd Font
$wallpaper = /home/mika/Pictures/Wallpapers/wallhaven-k8d851.jpg

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = apple, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, apple
    animation = fadeOut, 1, 3, apple
    animation = inputFieldDots, 1, 3, apple
}

# Both monitors are covered; controls stay on the left/main monitor.
background {
    monitor =
    path = $wallpaper
    color = rgb(0b0b0b)
    blur_size = 8
    blur_passes = 3
    noise = 0.008
    contrast = 1.05
    brightness = 0.32
    vibrancy = 0.04
    vibrancy_darkness = 0.0
}

shape {
    monitor = DP-1
    size = 460, 360
    color = rgba(0d0d0df2)
    rounding = 28
    border_size = 1
    border_color = rgba(ffffff35)
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(000000aa)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = 󰣇
    color = rgb(f4f4f4)
    font_size = 32
    font_family = $font
    position = 0, 128
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(ffffff)
    font_size = 44
    font_family = $font
    position = 0, 67
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %d. %B"
    color = rgb(989898)
    font_size = 11
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = $USER
    color = rgb(d7d7d7)
    font_size = 12
    font_family = $font
    position = 0, -18
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 340, 52
    outline_thickness = 1
    rounding = 16

    inner_color = rgba(171717f2)
    outer_color = rgba(ffffff55)
    check_color = rgba(ffffffff)
    fail_color = rgba(8a8a8aff)
    font_color = rgb(ffffff)

    font_family = $font
    placeholder_text = <span foreground="##888888">Passwort</span>
    fail_text = <span foreground="##ffffff">Passwort ist nicht korrekt</span>
    check_text = <span foreground="##111111">Wird entsperrt …</span>

    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    fade_on_empty = false
    swap_font_color = true

    position = 0, -76
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = Passwort eingeben und Enter drücken
    color = rgb(707070)
    font_size = 9
    font_family = $font
    position = 0, -128
    halign = center
    valign = center
}
