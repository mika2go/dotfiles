general {
    lock_cmd = qs ipc call lock activate || hyprlock
    before_sleep_cmd = qs ipc call lock activate || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Lock after one idle hour. Active media and games may inhibit idling.
listener {
    timeout = 3600
    on-timeout = qs ipc call lock activate || hyprlock
}

# Turn both monitors off one minute after the lock screen appears.
listener {
    timeout = 3660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
